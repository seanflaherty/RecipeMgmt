[tool.poetry]
name = "recipe-book-app"
version = "0.1.0"
description = "Recipe book FastAPI app"
authors = ["Sean Flaherty <sean.flaherty@gmail.com>"]
readme = "README.md"
packages = [{ include = "recipe_mgmt", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = { version = ">=0.110.0", extras = ["standard"] }
uvicorn = ">=0.28.0"
connexion = { version = ">=3.2.0,<4.0.0", extras = ["swagger-ui", "flask"] }  # <-- Added "flask" here
jsonschema = "<4.18.0"
pydantic = ">=2.14.2,<3.0.0"

[[tool.mypy.overrides]]
module = "connexion.*"
ignore_missing_imports = true

[tool.pylint.main]
init-hook = "import sys; sys.path.append('.')"
source-roots = ["src"]

[tool.pytest.ini_options]
# SCF pythonpath = ["."]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
